name: CSCFlow CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FLOW_IMAGE: sacahan/cscflow-flow
  TASK_IMAGE: sacahan/cscflow-task
  CONTAINER_FLOW: cscflow-flow
  CONTAINER_TASK: cscflow-task
  PORT: 8000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Load Flow Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.FLOW_IMAGE }}:latest
          build-args: |
            VITE_CWA_API_KEY=${{ secrets.VITE_CWA_API_KEY }}
            VITE_API_USERNAME=${{ secrets.VITE_API_USERNAME }}
            VITE_API_PASSWORD=${{ secrets.VITE_API_PASSWORD }}

      - name: Build and Load Task Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.task
          push: false
          load: true
          tags: ${{ env.TASK_IMAGE }}:latest

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d

      - name: Health check Flow Service
        run: |
          echo "Waiting for Flow service to become healthy..."
          TIMEOUT=60
          NEXT_WAIT_TIME=0
          until [ "$(docker inspect -f '{{.State.Running}}' ${{ env.CONTAINER_FLOW }})" == "true" ] || [ $NEXT_WAIT_TIME -ge $TIMEOUT ]; do
            echo "Waiting for container to start... ($NEXT_WAIT_TIME/$TIMEOUT)"
            sleep 5
            let NEXT_WAIT_TIME=NEXT_WAIT_TIME+5
          done

          # 檢查 8000 埠是否響應
          if ! curl -s --head  --request GET http://localhost:${{ env.PORT }} | grep "200 OK" > /dev/null; then
            echo "⚠️ Flow service started but port ${{ env.PORT }} not responding yet, checking logs..."
            docker logs ${{ env.CONTAINER_FLOW }} --tail 20
          else
            echo "✅ Flow service is responding on port ${{ env.PORT }}!"
          fi

      - name: Cleanup old images
        run: |
          docker image prune -f
