services:
    frontend:
        build:
            context: ./packages/frontend
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        environment:
            - VITE_API_URL=http://backend:8000
        depends_on:
            - backend

    backend:
        build:
            context: ./packages/backend
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        environment:
            - DATABASE_URL=postgresql://user:password@db:5432/cscflow?schema=public
        depends_on:
            - db

    db:
        image: postgres:15-alpine
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=user
            - POSTGRES_PASSWORD=password
            - POSTGRES_DB=cscflow
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
