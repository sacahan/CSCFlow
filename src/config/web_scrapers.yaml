version: "1.0"
last_updated: "2024-07-29"

global_settings:
    request_timeout: 30
    retry_attempts: 3
    retry_delay: 5

centers:
    # 北投運動中心
    taipei_beitou:
        basic_info:
            name: "台北市北投運動中心"
            address: "台北市北投區石牌路一段39巷100號"
            zip_code: "112"
            website_url: "https://www.btsport.org.tw/"
        collector:
            type: "web_scraper"
            config:
                url: "https://www.btsport.org.tw/"
                selectors:
                    gym:
                        current:
                            selector: "#gym-count"
                            type: "text"
                            transform: "parseInt"
                    pool:
                        current:
                            selector: "#pool-count"
                            type: "text"
                            transform: "parseInt"
        facility_info:
            gym:
                available: true
                max_capacity: 60
            pool:
                available: true
                max_capacity: 200
        status: true

