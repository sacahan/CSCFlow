services:
  frontend:
    container_name: frontend-container
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend

  backend:
    container_name: backend-container
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@localhost:5432/cscflow
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=rzKI!i5rxxOTKO^EC4f&PMgVLq9%zFb1
      - CORS_ORIGINS=http://frontend:3000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
  db:
    container_name: postgres-container
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=cscflow
    volumes:
      - /Users/sacahan/Documents/workspace/CSCFlow/docker_mount/postgres:/var/lib/postgresql/data

  redis:
    container_name: redis-container
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - /Users/sacahan/Documents/workspace/CSCFlow/docker_mount/redis:/data
    command: ["redis-server", "--requirepass", "yourpassword"]
    environment:
      - REDIS_PASSWORD=yourpassword
