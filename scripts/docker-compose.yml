services:
  db:
    container_name: postgres-container
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=cscflow
    volumes:
      - /Users/sacahan/Documents/workspace/CSCFlow/docker_mount/postgres:/var/lib/postgresql/data

  redis:
    container_name: redis-container
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - /Users/sacahan/Documents/workspace/CSCFlow/docker_mount/redis:/data
    command: ["redis-server", "--requirepass", "%@z%dVBRS2f8io"]
