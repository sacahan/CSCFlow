version: '1.0'
last_updated: '2024-07-29'

global_settings:
  request_timeout: 5
  retry_attempts: 0
  retry_delay: 0

centers:
  # 內湖運動中心
  taipei_neihu:
    basic_info:
      name: "台北市內湖運動中心"
      address: "台北市內湖區洲子街12號"
      zip_code: "114"
      website_url: "https://nhsc.cyc.org.tw/"
    collector:
      type: "api_client"
      config:
        endpoints: ["https://nhsc.cyc.org.tw/api"]
        method: "POST"
        headers:
          Content-Type: "application/json"
        response_mapping:
          gym:
            path: "gym.0"
            type: "integer"
          pool:
            path: "swim.0"
            type: "integer"
